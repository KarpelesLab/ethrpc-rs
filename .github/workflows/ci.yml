name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # Guard the lean builds: every optional feature must really be optional,
      # so the crate has to compile and pass tests in each combination. Bare
      # `--no-default-features` is the chain-metadata-only build, which must not
      # pull in rsurl or the async stack at all.
      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Test (abi only)
        run: cargo test --no-default-features --features abi

      - name: Test (rpc only)
        run: cargo test --no-default-features --features rpc

  wasm:
    name: wasm32 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The browser Fetch backend's futures are `!Send` (they hold `Rc`s), so
      # the `Handler` trait drops its `Send` bounds on wasm32. Nothing in a
      # native build exercises that path — only compiling for the target does.
      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: cargo check --target wasm32-unknown-unknown --all-features
        run: cargo check --target wasm32-unknown-unknown --all-features

      - name: cargo check --target wasm32-unknown-unknown --no-default-features
        run: cargo check --target wasm32-unknown-unknown --no-default-features

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. Compiling on
      # the declared minimum guards against accidentally using a std/library or
      # language feature newer than 1.88 (behavior itself is covered by the
      # stable `test` job, so this is compile-only).
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --all-features --all-targets
        run: cargo check --all-features --all-targets

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
